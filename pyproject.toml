[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-tracker"
version = "1.0.3"
description = "Track osu! game statistics from Tosu."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
    "pypresence>=4.6.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
osu-tracker = "OsuTracker.gui:main"
osu-tracker-cli = "OsuTracker.cli:main"

[tool.setuptools.packages.find]
include = ["OsuTracker*"]

[tool.setuptools.package-data]
OsuTracker = ["assets/azure/**/*", "assets/fonts/*", "images/*"]
